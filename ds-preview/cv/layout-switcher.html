<!-- @dsCard group="CV Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CV Layout Switcher</title>
<link rel="stylesheet" href="../_base.css">
<style>
  .switcher { display: flex; gap: 12px; margin-bottom: 20px; }
  .option { flex: 1; border: 2px solid var(--border); padding: 14px; cursor: pointer; }
  .option-active { border-color: var(--primary); background: oklch(0.52 0.18 195 / 0.06); }
  .opt-name { font-size: 12px; font-weight: 700; color: var(--fg); font-family: var(--font); margin-bottom: 4px; }
  .opt-desc { font-size: 10px; color: var(--muted-fg); }
  .opt-badge { display: inline-block; font-size: 9px; font-family: var(--font); padding: 1px 6px; border: 1px solid var(--primary); color: var(--primary); margin-top: 6px; }
  .thumb { width: 100%; height: 50px; background: var(--bg); border: 1px solid var(--border-muted); margin-bottom: 8px; display: flex; gap: 4px; padding: 6px; }
  .thumb-col { height: 100%; background: var(--secondary); flex: 1; }
  .thumb-sidebar { height: 100%; background: var(--secondary); width: 28%; }
  .thumb-main { height: 100%; background: oklch(0.12 0 0); flex: 1; }
</style>
</head>
<body>
<div class="switcher">
  <div class="option option-active">
    <div class="thumb">
      <div class="thumb-col"></div>
    </div>
    <div class="opt-name">CLASSIC</div>
    <div class="opt-desc">Full-width single column, print-optimized</div>
    <div class="opt-badge">SELECTED</div>
  </div>
  <div class="option">
    <div class="thumb">
      <div class="thumb-sidebar"></div>
      <div class="thumb-main"></div>
    </div>
    <div class="opt-name">RESUME</div>
    <div class="opt-desc">Two-column sidebar layout</div>
  </div>
</div>
</body>
</html>
