<html lang="en">
<head>

<title>Portfolio Footer</title>
<link rel="stylesheet" href="../_base.css">
<style>
  body { padding: 0; }
  footer { border-top: 1px solid var(--border); background: var(--card); padding: 16px 24px; }
  .inner { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .copy { font-size: 10px; color: var(--muted-fg); font-family: var(--font); }
  .links { display: flex; gap: 14px; }
  .link { font-size: 10px; color: var(--primary); font-family: var(--font); text-decoration: none; }
  .sys { font-size: 10px; color: var(--muted-fg); font-family: var(--font); display: flex; align-items: center; gap: 4px; }
  .ok { color: var(--primary); }
</style>
</head>
<body>
<footer>
  <div class="inner">
    <div class="copy">© 2024 Francesco Bassignana — SYSTEM_PORTFOLIO_v2.0</div>
    <div class="links">
      <a class="link" href="#">GITHUB</a>
      <a class="link" href="#">LINKEDIN</a>
      <a class="link" href="#">CONTACT</a>
      <a class="link" href="#">CV</a>

    <div class="sys">ALL_SYSTEMS <span class="ok">NOMINAL ✓</span></div>
  </div>
</footer>
</body>
</html>
