<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Semantic Search</title>
<link rel="stylesheet" href="../_base.css">
<style>
  .section { margin-bottom: 20px; }
  .search-wrap { border: 1px solid var(--border); background: var(--card); padding: 12px 16px; }
  .search-row { display: flex; align-items: center; gap: 8px; }
  .search-icon { color: var(--primary); font-size: 14px; }
  .search-inp { flex: 1; background: transparent; border: none; outline: none; color: var(--fg); font-family: var(--font); font-size: 12px; }
  .search-inp::placeholder { color: var(--muted-fg); }
  .search-badge { font-size: 9px; font-family: var(--font); color: var(--primary); border: 1px solid oklch(0.52 0.18 195 / 0.5); padding: 2px 6px; }
  .loading-bar { height: 2px; background: oklch(0.12 0 0); margin-top: 8px; position: relative; overflow: hidden; }
  .loading-fill { position: absolute; height: 100%; width: 40%; background: linear-gradient(90deg,transparent,var(--primary),transparent); animation: sl 1.5s ease-in-out infinite; }
  @keyframes sl{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
  .results { margin-top: 10px; }
  .result-item { padding: 8px 0; border-bottom: 1px solid var(--border-muted); display: flex; justify-content: space-between; align-items: flex-start; }
  .result-title { font-size: 12px; color: var(--fg); font-family: var(--font); }
  .result-snippet { font-size: 10px; color: var(--muted-fg); margin-top: 2px; }
  .result-score { font-size: 10px; color: var(--primary); font-family: var(--font); flex-shrink: 0; margin-left: 8px; }
</style>
</head>
<body>
<div class="section">
  <div class="label">Loading state</div>
  <div class="search-wrap">
    <div class="search-row">
      <span class="search-icon">&#9906;</span>
      <input class="search-inp" type="text" value="machine learning projects" readonly>
      <span class="search-badge">SEMANTIC</span>
    </div>
    <div class="loading-bar"><div class="loading-fill"></div></div>
  </div>
</div>
<div class="section">
  <div class="label">Results state</div>
  <div class="search-wrap">
    <div class="search-row">
      <span class="search-icon">&#9906;</span>
      <input class="search-inp" type="text" value="full stack development" readonly>
      <span class="search-badge">3 RESULTS</span>
    </div>
    <div class="results">
      <div class="result-item">
        <div><div class="result-title">PORTFOLIO_v22</div><div class="result-snippet">Next.js full-stack portfolio with AI features…</div></div>
        <span class="result-score">0.94</span>
      </div>
      <div class="result-item">
        <div><div class="result-title">SEMANTIC_SEARCH_API</div><div class="result-snippet">Vector embedding pipeline with FastAPI backend…</div></div>
        <span class="result-score">0.87</span>
      </div>
      <div class="result-item">
        <div><div class="result-title">EXPERIENCE: Freelance Dev</div><div class="result-snippet">Designed and shipped AI-powered web applications…</div></div>
        <span class="result-score">0.81</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
