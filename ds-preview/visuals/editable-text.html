<!-- @dsCard group="Visuals" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editable Text</title>
<link rel="stylesheet" href="../_base.css">
<style>
  .section { margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--border-muted); padding: 16px; }
  .normal { font-size: 14px; color: var(--fg); margin-bottom: 8px; }
  .editable {
    font-size: 14px; color: var(--fg); outline: 1px dashed oklch(0.52 0.18 195 / 0.6);
    outline-offset: 2px; cursor: text; padding: 2px; margin-bottom: 8px;
    display: inline-block; min-width: 40px;
  }
  .editable-focused {
    font-size: 14px; color: var(--fg); outline: 2px solid var(--primary);
    outline-offset: 2px; cursor: text; padding: 2px; margin-bottom: 8px;
    display: inline-block; min-width: 40px;
  }
  .mode-badge { font-size: 9px; font-family: var(--font); padding: 2px 6px; display: inline-block; margin-bottom: 8px; }
  .badge-view { background: transparent; border: 1px solid var(--border-muted); color: var(--muted-fg); }
  .badge-edit { background: oklch(0.52 0.18 195 / 0.15); border: 1px solid var(--primary); color: var(--primary); }
</style>
</head>
<body>
<div class="section">
  <div class="label">Read-only mode</div>
  <div class="card">
    <span class="mode-badge badge-view">VIEW_MODE</span><br>
    <span class="normal">Francesco Bassignana</span><br>
    <span class="normal" style="font-size:12px;color:var(--muted-fg)">Full-Stack Developer &amp; ML Engineer</span>
  </div>
</div>
<div class="section">
  <div class="label">Editor mode — hover state</div>
  <div class="card">
    <span class="mode-badge badge-edit">EDITOR_MODE</span><br>
    <span class="editable">Francesco Bassignana</span><br>
    <span class="editable" style="font-size:12px;color:var(--muted-fg)">Full-Stack Developer &amp; ML Engineer</span>
  </div>
</div>
<div class="section">
  <div class="label">Editor mode — focused/editing</div>
  <div class="card">
    <span class="mode-badge badge-edit">EDITOR_MODE</span><br>
    <span class="editable-focused">Francesco Bassignana|</span>
  </div>
</div>
</body>
</html>
