<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Color Picker</title>
<link rel="stylesheet" href="../_base.css">
<style>
  .section { margin-bottom: 24px; }
  .picker-btn { width: 36px; height: 36px; border: 1px solid var(--border); background: oklch(0.52 0.18 195); cursor: pointer; }
  .popover { background: var(--card); border: 1px solid var(--border); padding: 16px; max-width: 200px; margin-top: 10px; }
  .pop-title { font-size: 10px; color: var(--muted-fg); font-family: var(--font); margin-bottom: 10px; }
  .slider-row { margin-bottom: 10px; }
  .sl-lbl { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted-fg); margin-bottom: 4px; }
  .sl-val { color: var(--primary); }
  .track { width: 100%; height: 6px; position: relative; border: 1px solid var(--border-muted); }
  .fill { height: 100%; background: var(--primary); }
  .thumb { position: absolute; top: 50%; width: 10px; height: 10px; background: var(--primary); border: 1px solid var(--bg); transform: translateY(-50%); margin-left: -5px; }
  .swatch-row { display: flex; gap: 4px; margin-top: 6px; }
  .swatch { width: 16px; height: 16px; cursor: pointer; border: 1px solid transparent; }
  .swatch:hover { border-color: var(--fg); }
  .persist-btn { width: 100%; margin-top: 10px; height: 26px; background: oklch(0.52 0.18 195 / 0.1); border: 1px solid oklch(0.52 0.18 195 / 0.5); color: var(--primary); font-family: var(--font); font-size: 10px; cursor: pointer; }
</style>
</head>
<body>
<div class="section">
  <div class="label">Accent color picker (open state)</div>
  <div class="picker-btn"></div>
  <div class="popover">
    <div class="pop-title">ACCENT_COLOR</div>
    <div class="slider-row">
      <div class="sl-lbl"><span>HUE</span><span class="sl-val">195</span></div>
      <div class="track"><div class="fill" style="width:54%"></div><div class="thumb" style="left:54%"></div></div>
    </div>
    <div class="slider-row">
      <div class="sl-lbl"><span>SAT</span><span class="sl-val">72%</span></div>
      <div class="track"><div class="fill" style="width:72%"></div><div class="thumb" style="left:72%"></div></div>
    </div>
    <div class="slider-row">
      <div class="sl-lbl"><span>LGT</span><span class="sl-val">52%</span></div>
      <div class="track"><div class="fill" style="width:52%"></div><div class="thumb" style="left:52%"></div></div>
    </div>
    <div class="sl-lbl" style="margin-top:8px">PRESETS</div>
    <div class="swatch-row">
      <div class="swatch" style="background:oklch(0.52 0.18 195)"></div>
      <div class="swatch" style="background:oklch(0.55 0.2 145)"></div>
      <div class="swatch" style="background:oklch(0.6 0.18 280)"></div>
      <div class="swatch" style="background:oklch(0.6 0.22 25)"></div>
      <div class="swatch" style="background:oklch(0.65 0.15 60)"></div>
    </div>
    <button class="persist-btn">SAVE AS DEFAULT</button>
  </div>
</div>
</body>
</html>
