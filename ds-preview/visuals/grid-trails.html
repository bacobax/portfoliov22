<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grid Trails</title>
<link rel="stylesheet" href="../_base.css">
<style>
  body { padding: 0; background: #0d0d0d; display: flex; align-items: center; justify-content: center; min-height: 240px; }
  canvas { display: block; }
  .wrap { position: relative; }
  .note { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); font-size: 9px; color: oklch(0.52 0.18 195 / 0.5); font-family: monospace; white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
<canvas id="c" width="400" height="220"></canvas>
<div class="note">GRID_TRAILS — cursor interaction layer</div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 400, H = 220;
const GS = 20;
const cols = Math.ceil(W/GS), rows = Math.ceil(H/GS);
const heat = Array.from({length:rows},()=>new Float32Array(cols));

let mx = W/2, my = H/2;
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mx = e.clientX-r.left; my = e.clientY-r.top;
});

function draw() {
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0d0d0d'; ctx.fillRect(0,0,W,H);

  // simulate auto-moving cursor
  const t = Date.now()*0.001;
  const ax = W/2 + Math.cos(t*0.7)*130, ay = H/2 + Math.sin(t*0.9)*80;
  const gx = Math.floor(ax/GS), gy = Math.floor(ay/GS);
  for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++){
    const nx=gx+dx,ny=gy+dy;
    if(nx>=0&&nx<cols&&ny>=0&&ny<rows){
      const d=Math.sqrt(dx*dx+dy*dy);
      heat[ny][nx] = Math.min(1, heat[ny][nx]+Math.max(0,0.35-d*0.12));
    }
  }

  // draw grid
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      heat[r][c]*=0.94;
      const v=heat[r][c];
      if(v>0.01){
        ctx.strokeStyle=`oklch(0.52 0.18 195 / ${(v*0.9).toFixed(2)})`;
        ctx.lineWidth=v*1.5;
        const x=c*GS, y=r*GS;
        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+GS,y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+GS); ctx.stroke();
      } else {
        ctx.strokeStyle='oklch(0.52 0.18 195 / 0.05)';
        ctx.lineWidth=0.5;
        const x=c*GS,y=r*GS;
        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+GS,y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+GS); ctx.stroke();
      }
    }
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
